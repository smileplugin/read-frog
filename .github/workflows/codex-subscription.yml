name: Codex subscription

on:
  push:
    branches: [feat/codex-subscription]
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_FREE_API: "true"
  WXT_SKIP_ENV_VALIDATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:codex-bridge
      - run: pnpm fmt:check
      - run: pnpm type-check
      - run: pnpm test src/entrypoints/options/pages/api-providers/providers-config/__tests__ src/utils/providers/__tests__
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: read-frog-codex-chrome
          path: .output/chrome-mv3/
          include-hidden-files: true
