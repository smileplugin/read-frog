name: Codex subscription

on:
  push:
    branches: [feat/codex-subscription]
  workflow_dispatch:

permissions:
  contents: read

env:
  SKIP_FREE_API: "true"
  WXT_SKIP_ENV_VALIDATION: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          cache: true
          install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:codex-bridge
      - run: pnpm fmt:check
      - run: pnpm type-check
        if: ${{ !cancelled() }}
      - run: pnpm test src/entrypoints/options/pages/api-providers/providers-config/__tests__ src/utils/providers/__tests__ src/entrypoints/background/__tests__/translation-queues.test.ts
        if: ${{ !cancelled() }}
      - run: pnpm build
        if: ${{ !cancelled() }}
      - name: Package extension and local companion
        run: |
          mkdir -p dist/read-frog-codex/extension dist/read-frog-codex/codex-bridge
          cp -R .output/chrome-mv3/. dist/read-frog-codex/extension/
          cp codex-bridge/client.mjs codex-bridge/server.mjs dist/read-frog-codex/codex-bridge/
          cp CODEX_SUBSCRIPTION.md dist/read-frog-codex/
          cp CODEX_LATENCY_SOURCES.md dist/read-frog-codex/
      - uses: actions/upload-artifact@v4
        with:
          name: read-frog-codex-chrome
          path: dist/read-frog-codex/
